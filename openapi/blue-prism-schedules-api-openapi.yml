        initialTaskId: 4
        isRetired: false
        tasksCount: 3
        intervalType: Hour
        timePeriod: 2
        startPoint: '0001-01-01T09:00:00+01:00'
        endPoint: '0001-01-01T17:30:00+01:00'
        dayOfWeek: Tuesday
        dayOfMonth: First
