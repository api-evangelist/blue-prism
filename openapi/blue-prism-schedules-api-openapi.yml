openapi: 3.2.0
info:
  title: Blue Prism Schedules API
  description: An API to expose core functionality of the Blue Prism product.
  version: 7.5.1
security:
- Bearer:
  - bp-api
  - bpserver
- OAuth2:
  - bp-api
  - bpserver
tags:
- name: Schedules
paths:
  /api/v7/schedules:
    get:
      summary: Return a list of schedules in the environment
      operationId: getSchedules
      description: '> ### Permissions required

        At least one of: `View Schedule` | `Edit Schedule` | `Delete Schedule`

        | `Create Schedule` | `Retire Schedule` | `System - Scheduler`'
      tags:
      - Schedules
      parameters:
      - name: name
        description: A filter to search for name of the schedule.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/BasicStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: retirementStatus
        description: A filter to search for the retirement status of the schedule. The default behavior is to search for all statuses.
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Active
            - Retired
      - name: itemsPerPage
        in: query
        description: The maximum number of items to retrieve per page.
        schema:
          type: integer
          minimum: 1
      - name: pagingToken
        in: query
        description: The token to point to the last item previously returned.
        schema:
          type: string
      responses:
        '200':
          description: A list of schedule summaries was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleItemsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a new schedule definition
      operationId: createSchedule
      description: '> ### Permissions required: `Create Schedule`


        and `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: copyFrom
        in: query
        description: Schedule ID to create copy against.
        deprecated: true
        schema:
          type: integer
      requestBody:
        description: Details of the schedule definition to create or to update when cloning. To send a request without a body, enter a null value (swagger only).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleDetailsOptionalName'
      responses:
        '201':
          description: The schedule definition was successfully created/copied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScheduleDefinitionResponseModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v7/schedules/{scheduleId}:
    get:
      summary: Return requested schedule summary
      operationId: getSchedule
      description: '> ### Permissions required

        At least one of: `View Schedule` | `Edit Schedule` | `Delete Schedule`

        | `Create Schedule` | `Retire Schedule` | `System - Scheduler`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule to return.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: The schedule summary was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleDefinitionResponseModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a given schedule
      operationId: updateSchedule
      description: '> ### Permissions required

        For editing: `Edit Schedule`


        For retiring all of the following: `Edit Schedule` | `Retire Schedule`


        For unretiring all of the following: `Edit Schedule` | `Retire Schedule` | `Create Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule to update.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleDetailsOptionalName'
      responses:
        '200':
          description: The schedule was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleDefinitionResponseModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a specified schedule
      operationId: deleteSchedule
      description: '> ### Permissions required: `Delete Schedule`


        and `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule to delete.
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: The schedule was successfully deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v7/schedules/{scheduleId}/clones:
    post:
      summary: Clone a new schedule definition
      operationId: CloneSchedule
      description: '> ### Permissions required

        `Create Schedule` and `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule to copy.
        required: true
        schema:
          type: integer
      requestBody:
        description: Details of the schedule definition to update. Name can not be a null value.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneScheduleDetails'
      responses:
        '200':
          description: The schedule summary was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScheduleDefinitionResponseModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v7/schedules/{scheduleId}/sessions:
    post:
      deprecated: true
      summary: Create a session and set a schedule to run at a specific date and time
      operationId: startSchedule
      description: '> ### Permissions required: `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule to start.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSessionStart'
      responses:
        '202':
          description: The schedule was successfully set to run at a specified date and time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSessionStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      deprecated: true
      summary: Request the schedule to stop
      operationId: stopSchedule
      description: '> ### Permissions required: `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule.
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: The request to stop the schedule was successfully sent.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v7/schedules/{scheduleId}/runs/active:
    delete:
      summary: Request the schedule to stop
      operationId: deleteApiV7SchedulesByScheduleIdRunsActive
      description: '> ### Permissions required: `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule.
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: The request to stop the schedule was successfully sent.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-operation-id-source: normalized
      x-operation-id-original: stopSchedule
  /api/v7/schedules/{scheduleId}/tasks:
    get:
      summary: Return a list of tasks in a schedule
      operationId: getScheduleTasks
      description: '> ### Permissions required

        At least one of: `View Schedule` | `Edit Schedule` | `Delete Schedule`

        | `Create Schedule` | `Retire Schedule` | `System - Scheduler`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule for which to retrieve tasks.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: A list of tasks is successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a task in a schedule
      operationId: createScheduleTask
      description: '> ### Permissions required

        At least one of: `Create Schedule` | `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule for which to create task.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledTask'
      responses:
        '201':
          description: An ID of successfully created task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScheduledTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorMessage'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v7/schedules/{scheduleId}/tasks/{taskId}:
    get:
      summary: Return a given scheduled task
      operationId: getScheduleTask
      description: '> ### Permissions required

        At least one of: `View Schedule` | `Edit Schedule` | `Delete Schedule`

        | `Create Schedule` | `Retire Schedule` | `System - Scheduler`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule that task belongs to.
        required: true
        schema:
          type: integer
      - name: taskId
        in: path
        description: The ID of the scheduled task to return.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: The schedule task  was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a given scheduled task
      operationId: deleteScheduleTask
      description: '> ### Permissions required: `Edit Schedule`


        and `Delete Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule that task belongs to.
        required: true
        schema:
          type: integer
      - name: taskId
        in: path
        description: The ID of the task to delete.
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: The task was successfully deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a given scheduled task
      operationId: updateScheduleTask
      description: '> ### Permissions required: `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule that task belongs to
        required: true
        schema:
          type: integer
      - name: taskId
        in: path
        description: The ID of the scheduled task to update.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledTask'
      responses:
        '204':
          description: The scheduled task was successfully updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v7/schedules/{scheduleId}/tasks/{taskId}/sessions/{sessionId}:
    delete:
      summary: Delete scheduled task session
      operationId: deleteScheduledTaskSession
      description: '> ### Permissions required: `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule.
        required: true
        schema:
          type: integer
      - name: taskId
        in: path
        description: The ID of the scheduled task.
        required: true
        schema:
          type: integer
      - name: sessionId
        in: path
        description: The ID of the scheduled task session.
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: The scheduled task session was successfully deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v7/schedules/{scheduleId}/tasks/{taskId}/sessions:
    get:
      summary: Return a list of the scheduled sessions for a specified task
      operationId: getScheduledSessionForTask
      description: '> ### Permissions required

        At least one of: `View Schedule` | `Edit Schedule` | `Delete Schedule`

        | `Create Schedule` | `Retire Schedule` | `System - Scheduler`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule that task belongs to.
        required: true
        schema:
          type: integer
      - name: taskId
        in: path
        description: The ID of the task to retrieve data for.
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: A collection of the associated scheduled sessions for a specific task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a scheduled session in task
      operationId: createScheduleSessionForTask
      description: '> ### Permissions required

        At least one of: `View Resource Screen Capture` | `View Resource Details`

        | `Manage Resource Access Rights` | `Control Resource` | `Configure Resource`

        | `View Resource`


        And at least one of: `View Process Definition` | `Export Process`

        | `Execute Process` | `Manage Process Access Rights`

        | `Execute Process as Web Service` | `Edit Process Groups` | `Edit Process`

        | `Delete Process` | `Create Process`


        and `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule that task belongs to.
        required: true
        schema:
          type: integer
          minimum: 1
      - name: taskId
        in: path
        description: The ID of the task for which to create scheduled session.
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        description: Parameters of the scheduled session to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledSessionParameters'
      responses:
        '201':
          description: A successfully created scheduled session ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScheduledSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorMessage'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v7/schedules/tasks/{taskId}/sessions:
    get:
      deprecated: true
      summary: Return a list of the scheduled sessions for a specified task
      operationId: getSchduledSessionsForTask
      description: '> ### Permissions required

        At least one of: `View Schedule` | `Edit Schedule` | `Delete Schedule`

        | `Create Schedule` | `Retire Schedule` | `System - Scheduler`'
      tags:
      - Schedules
      parameters:
      - name: taskId
        in: path
        description: The ID of the task to retrieve data for.
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: A collection of the associated scheduled sessions for a specific task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v7/schedules/{scheduleId}/tasks/{taskId}/scheduledSessionParameters:
    put:
      summary: Update start-up parameters
      operationId: updateStartupParameters
      description: '> ### Permissions required: `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule to update start-up parameters for.
        required: true
        schema:
          type: integer
          minimum: 1
      - name: taskId
        in: path
        description: The ID of the task to update start-up parameters for.
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        description: A collection of start up parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledSessionArguments'
      responses:
        '204':
          description: Associated scheduled sessions for a specific task were updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: Return start-up parameters
      operationId: getStartupParameters
      description: '> ### Permissions required

        At least one of: `View Schedule` | `Edit Schedule` | `Delete Schedule`

        | `Create Schedule` | `Retire Schedule` | `System - Scheduler`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule to retrieve start-up parameters for.
        required: true
        schema:
          type: integer
          minimum: 1
      - name: taskId
        in: path
        description: The ID of the task to retrieve start-up parameters for.
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: A collection of start up parameters for a specific task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledSessionArguments'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v7/schedules/{scheduleId}/logs:
    get:
      deprecated: true
      summary: Return all logs for a specified schedule
      operationId: getLogsForSchedule
      description: '> ### Permissions required

        At least one of: `View Schedule` | `Edit Schedule` | `Delete Schedule`

        | `Create Schedule` | `Retire Schedule` | `System - Scheduler`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        description: The ID of the schedule to retrieve data for
        in: path
        required: true
        schema:
          type: integer
      - name: sortBy
        description: The field that results should be sorted by and the direction they should be sorted in.
        in: query
        required: false
        schema:
          type: string
          enum:
          - EndTimeAsc
          - EndTimeDesc
          - ScheduleLogIdAsc
          - ScheduleLogIdDesc
          - ScheduleNameAsc
          - ScheduleNameDesc
          - ServerNameAsc
          - ServerNameDesc
          - StartTimeAsc
          - StartTimeDesc
          - StatusAsc
          - StatusDesc
      - name: itemsPerPage
        description: The number of items to show per page
        in: query
        required: false
        schema:
          type: integer
      - name: scheduleLogStatus
        description: A filter to search for the status of the log.
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Pending
            - Running
            - Terminated
            - Completed
            - PartExceptioned
      - name: startTime
        description: A filter to search for the log start time.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
            $ref: '#/components/examples/DateTimeRangeExample'
          greater:
            $ref: '#/components/examples/DateTimeGreaterThanExample'
      - name: endTime
        description: A filter to search for the log end time.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
            $ref: '#/components/examples/DateTimeRangeExample'
          greater:
            $ref: '#/components/examples/DateTimeGreaterThanExample'
      - name: pagingToken
        description: The token to point to the last item previously returned
        in: query
        schema:
          type: string
      - name: scheduleName
        description: A filter to search for name of the schedule.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/BasicStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: serverName
        description: A filter to search for name of the server.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/BasicStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      responses:
        '200':
          description: A page containing a list of schedule log items and paging token are successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleLogDeprecatedItemsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v7/schedules/logs:
    get:
      deprecated: true
      summary: Return all schedule logs
      operationId: getAllScheduleLogs
      description: '> ### Permissions required

        At least one of: `View Schedule` | `Edit Schedule` | `Delete Schedule`

        | `Create Schedule` | `Retire Schedule` | `System - Scheduler`'
      tags:
      - Schedules
      parameters:
      - name: sortBy
        description: The field that results should be sorted by and the direction they should be sorted in.
        in: query
        required: false
        schema:
          type: string
          enum:
          - EndTimeAsc
          - EndTimeDesc
          - ScheduleLogIdAsc
          - ScheduleLogIdDesc
          - ScheduleNameAsc
          - ScheduleNameDesc
          - ServerNameAsc
          - ServerNameDesc
          - StartTimeAsc
          - StartTimeDesc
          - StatusAsc
          - StatusDesc
      - name: itemsPerPage
        description: The maximum number of items to retrieve per page.
        in: query
        required: false
        schema:
          type: integer
      - name: scheduleLogStatus
        description: A filter to search for the status of the log.
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Pending
            - Running
            - Terminated
            - Completed
            - PartExceptioned
      - name: startTime
        description: A filter to search for the log start time.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
            $ref: '#/components/examples/DateTimeRangeExample'
          greater:
            $ref: '#/components/examples/DateTimeGreaterThanExample'
      - name: endTime
        description: A filter to search for the log end time.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
            $ref: '#/components/examples/DateTimeRangeExample'
          greater:
            $ref: '#/components/examples/DateTimeGreaterThanExample'
      - name: pagingToken
        in: query
        description: The token to point to the last item previously returned.
        schema:
          type: string
      - name: scheduleName
        description: A filter to search for name of the schedule.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/BasicStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: serverName
        description: A filter to search for name of the server.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/BasicStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      responses:
        '200':
          description: A page containing a list of schedule log items and a paging token are successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleLogDeprecatedItemsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v7/schedules/{scheduleId}/runs:
    post:
      summary: Create a session and set a schedule to run at a specific date and time
      operationId: createSessionRun
      description: '> ### Permissions required: `Edit Schedule`'
      tags:
      - Schedules
      parameters:
      - name: scheduleId
        in: path
        description: The ID of the schedule to start.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSessionStart'
      responses:
        '202':
          description: The schedule was successfully set to run at a specified date and time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSessionStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
