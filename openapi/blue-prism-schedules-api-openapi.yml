      example:
        strtw: null
    ScheduleSummary:
      description: Contains basic details of a session.
      type: object
      properties:
        id:
          type: integer
          description: The ID of the schedule.
        name:
          type: string
          description: The name of the schedule.
        description:
          type: string
          description: The description of the schedule.
        initialTaskId:
          type: integer
          description: The ID of the initial task this schedule executes.
        isRetired:
          type: boolean
          description: If the schedule is retired or not.
        tasksCount:
          type: integer
          description: The number of tasks a schedule has.
        intervalType:
          type: string
          description: The type of interval the schedule runs at.
          enum:
          - Once
          - Minute
          - Hour
          - Day
          - Week
          - Month
          - Year
        timePeriod:
          type: integer
          description: The time period to apply to the intervalType on which the schedule will run. This cannot be applied to an intervalType of "Once". For example, timePeriod "2" with intervalType "Day" will run the schedule every 2 days.
        startPoint:
          type: string
          description: The earliest time from which a schedule will run when the intervalType is set to "Day".
          format: date-time
        endPoint:
          type: string
          description: The latest time from which a schedule will run when the intervalType is set to "Day".
          format: date-time
        dayOfWeek:
          type:
          - string
          - 'null'
          description: The day of the week that the schedule will run on when intervalType is "Week" or "Month".
          enum:
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
        dayOfMonth:
          type: string
          description: The position of the specified day in the month on which a schedule will run. This should be combined with the dayOfWeek value. For example, the "Second Monday" in the month, or the "Third Friday" in the month.
          enum:
          - Last
          - None
          - First
          - Second
          - Third
          - Fourth
          - Fifth
        startDate:
          type:
          - string
          - 'null'
          description: The earliest date the schedule will run.
          format: date-time
        endDate:
          type:
          - string
          - 'null'
          description: The last date on which the schedule will run. If this value is null or missing, the schedule will run indefinitely.
          format: date-time
        calendarId:
          type: integer
          description: The ID of the calendar.
        calendarName:
          type: string
          description: The name of the calendar.
