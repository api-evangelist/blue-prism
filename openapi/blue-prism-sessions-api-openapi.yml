        At least one of: `Create Process` | `Delete Process` | `Edit Process`

        | `Edit Process Groups` | `Export Process` | `Execute Process`

        | `Execute Process as Web Service` | `View Process Definition`

        | `Manage Process Access Rights`


        And at least one of: `View Resource` | `View Resource Screen Captures`

        | `Configure Resource` | `Control Resource` | `Manage Resource Access Rights`


        and `Audit - Process Logs`'
      tags:
      - Sessions
      parameters:
      - name: sessionId
        in: path
        description: The ID of the session to retrieve data for.
        required: true
        schema:
          type: string
          format: uuid
      - name: sortBy
        in: query
        description: The field that results should be sorted by and the direction they should be sorted in.
        required: false
        style: form
        explode: false
        schema:
          title: getSessionLogsSortBy
          type: string
          enum:
          - LogNumberAsc
          - LogNumberDesc
          - StageIdAsc
          - StageIdDesc
          - StageNameAsc
          - StageNameDesc
          - StageTypeAsc
          - StageTypeDesc
          - ProcessNameAsc
          - ProcessNameDesc
          - PageNameAsc
          - PageNameDesc
          - ObjectNameAsc
          - ObjectNameDesc
          - ActionNameAsc
          - ActionNameDesc
          - ResultAsc
          - ResultDesc
          - ResultTypeAsc
          - ResultTypeDesc
          - ResourceStartTimeAsc
          - ResourceStartTimeDesc
          - ResourceEndTimeAsc
          - ResourceEndTimeDesc
          - BluePrismMemoryAsc
          - BluePrismMemoryDesc
          - TargetAppIdAsc
          - TargetAppIdDesc
          - TargetMemoryAsc
          - TargetMemoryDesc
      - name: logNumber
        in: query
        description: A filter to search for the log id/number.
        style: deepObject
        required: false
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/IntegerEqualsExample'
          range:
            $ref: '#/components/examples/IntegerRangeExample'
          less:
            $ref: '#/components/examples/IntegerLessThanExample'
      - name: stageId
        in: query
        description: A filter to search for the id of the stage.
        required: false
        style: deepObject
        schema:
          $ref: '#/components/schemas/EqualsFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
      - name: stageName
        in: query
        description: A filter to search for the name of the stage.
        required: false
        style: deepObject
        schema:
          $ref: '#/components/schemas/FullStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          contains:
            $ref: '#/components/examples/StringContainsExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: stageType
        in: query
        description: A filter to search for the type of the stage.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/StageType'
      - name: processName
        in: query
        description: A filter to search for the name of the process.
        required: false
        style: deepObject
        schema:
          $ref: '#/components/schemas/FullStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          contains:
            $ref: '#/components/examples/StringContainsExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: pageName
        in: query
        description: A filter to search for the name of the page.
        required: false
        style: deepObject
        schema:
          $ref: '#/components/schemas/FullStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          contains:
            $ref: '#/components/examples/StringContainsExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: objectName
        in: query
        description: A filter to search for the name of the object.
        required: false
        style: deepObject
        schema:
          $ref: '#/components/schemas/FullStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          contains:
            $ref: '#/components/examples/StringContainsExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: actionName
        in: query
        description: A filter to search for the name of the action.
        required: false
        style: deepObject
        schema:
          $ref: '#/components/schemas/FullStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          contains:
            $ref: '#/components/examples/StringContainsExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: result
        in: query
        description: A filter to search for the result.
        required: false
        style: deepObject
        schema:
          $ref: '#/components/schemas/FullStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          contains:
            $ref: '#/components/examples/StringContainsExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: resultType
