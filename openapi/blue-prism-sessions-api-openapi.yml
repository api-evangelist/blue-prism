        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ResultType'
      - name: resourceStartTime
        description: A filter to search for the time that the session started.
        in: query
        style: deepObject
        required: false
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
            $ref: '#/components/examples/DateTimeRangeExample'
          greater:
            $ref: '#/components/examples/DateTimeGreaterThanExample'
      - name: resourceEndTime
        description: A filter to search for the time that the ended started.
        in: query
        style: deepObject
        required: false
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
