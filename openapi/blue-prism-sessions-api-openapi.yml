openapi: 3.2.0
info:
  title: Blue Prism Sessions API
  description: An API to expose core functionality of the Blue Prism product.
  version: 7.5.1
security:
- Bearer:
  - bp-api
  - bpserver
- OAuth2:
  - bp-api
  - bpserver
tags:
- name: Sessions
paths:
  /api/v7/sessions:
    get:
      summary: Return a list of sessions in the environment
      operationId: GetSessions
      description: '> ### Permissions required

        At least one of: `Create Process` | `Delete Process` | `Edit Process`

        | `Edit Process Groups` | `Export Process` | `Execute Process` | `Execute Process as Web Service`

        | `View Process Definition` | `Manage Process Access Rights`


        And at least one of: `View Resource` | `View Resource Screen Captures` | `Configure Resource`

        | `Control Resource` | `Manage Resource Access Rights`'
      tags:
      - Sessions
      parameters:
      - name: sortBy
        description: The field that results should be sorted by and the direction they should be sorted in.
        in: query
        required: false
        style: form
        explode: false
        schema:
          title: getSessionsSortBy
          type: string
          enum:
          - SessionNumberAsc
          - SessionNumberDesc
          - ProcessNameAsc
          - ProcessNameDesc
          - ResourceNameAsc
          - ResourceNameDesc
          - UserNameAsc
          - UserNameDesc
          - StatusAsc
          - StatusDesc
          - ExceptionTypeAsc
          - ExceptionTypeDesc
          - StartTimeAsc
          - StartTimeDesc
          - EndTimeAsc
          - EndTimeDesc
          - LatestStageAsc
          - LatestStageDesc
          - StageStartedAsc
          - StageStartedDesc
      - name: itemsPerPage
        description: The maximum number of items to retrieve.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: pagingToken
        description: The token to point to the last item previously returned.
        in: query
        required: false
        schema:
          type: string
      - name: processName
        description: A filter to search for the name of the process being run by the session.
        in: query
        style: deepObject
        required: false
        schema:
          $ref: '#/components/schemas/BasicStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: sessionNumber
        description: A filter to search for the session number.
        style: deepObject
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/BasicNumericFilter'
        examples:
          startsWith:
            $ref: '#/components/examples/IntegerStartsWithExample'
          equals:
            $ref: '#/components/examples/IntegerEqualsExample'
          range:
            $ref: '#/components/examples/IntegerRangeExample'
          greater:
            $ref: '#/components/examples/IntegerGreaterThanExample'
      - name: resourceName
        description: A filter to search for the name of the resource on which the session is running/ran.
        in: query
        required: false
        style: deepObject
        schema:
          $ref: '#/components/schemas/BasicStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: userName
        description: A filter to search for the name of the user that triggered the session.
        in: query
        required: false
        style: deepObject
        schema:
          $ref: '#/components/schemas/BasicStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: status
        description: The status of the sessions to search for.
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SessionStatus'
      - name: sessionSource
        description: The source of the sessions to search for.
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SessionSource'
      - name: startTime
        description: A filter to search for the time that the session started.
        in: query
        style: deepObject
        required: false
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
            $ref: '#/components/examples/DateTimeRangeExample'
          greater:
            $ref: '#/components/examples/DateTimeGreaterThanExample'
      - name: endTime
        description: A filter to search for the time that the session ended.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
            $ref: '#/components/examples/DateTimeRangeExample'
          greater:
            $ref: '#/components/examples/DateTimeGreaterThanExample'
      - name: latestStage
        description: A filter to search for the name of the latest stage.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/BasicStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
            $ref: '#/components/examples/DateTimeRangeExample'
          greater:
            $ref: '#/components/examples/DateTimeGreaterThanExample'
      - name: stageStarted
        description: A filter to search for the time when the latest stage started.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
            $ref: '#/components/examples/DateTimeRangeExample'
          greater:
            $ref: '#/components/examples/DateTimeGreaterThanExample'
      - name: onlySessionsForCurrentUser
        description: Flag to restrict sessions to API user.
        in: query
        schema:
          type:
          - boolean
          - 'null'
      - name: processId.eq
        description: The ID of the process to retrieve data for.
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      responses:
        '200':
          description: An array of session summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionItemsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a new session for the given resource ID and process ID
      operationId: createSession
      description: '> ### Permissions required

        At least one of: `Create Process` | `Edit Process` | `Execute Process`


        and `Control Resource`'
      tags:
      - Sessions
      requestBody:
        description: Parameters to create a new session
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionParameters'
      responses:
        '200':
          description: A newly created session ID.
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v7/sessions/{sessionId}:
    get:
      summary: Return details of a specified session
      operationId: getSession
      description: '> ### Permissions required

        At least one of: `Create Process` | `Delete Process` | `Edit Process`

        | `Edit Process Groups` | `Export Process` | `Execute Process` | `Execute Process as Web Service`

        | `View Process Definition` | `Manage Process Access Rights`


        And at least one of: `View Resource` | `View Resource Screen Captures` | `Configure Resource`

        | `Control Resource` | `Manage Resource Access Rights`'
      tags:
      - Sessions
      parameters:
      - name: sessionId
        in: path
        description: The ID of the session to retrieve data for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The session was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundSession'
    delete:
      summary: Deletes a specified pending session
      operationId: deleteSession
      description: '> ### Permissions required

        `Control Resource`


        And at least one of: `View Process Definition` | `Edit Process` | `Create Process`'
      tags:
      - Sessions
      parameters:
      - name: sessionId
        in: path
        description: The ID of the pending session to delete.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The pending session was successfully deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update the session for the given session ID
      operationId: updateSession
      description: '> ### Permissions required

        At least one of: `Create Process` | `Edit Process` | `Execute Process`


        and `Control Resource`'
      tags:
      - Sessions
      parameters:
      - name: sessionId
        in: path
        description: The ID of the session to update.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Details of the session to update, only supports 'Running', 'Stopping' and 'Stopped' statuses.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSession'
      responses:
        '202':
          description: The session has been successfully updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/SessionForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v7/sessions/{sessionId}/parameters:
    get:
      summary: Get start-up parameters for a specified session
      operationId: getSessionStartUpParameters
      description: '> ### Permissions required

        At least one of: `Create Process` | `Edit Process` | `Export Process`

        | `Execute Process` | `View Process Definition`


        And at least one of: `View Resource` | `View Resource Screen Captures` | `Configure Resource`

        | `Control Resource` | `Manage Resource Access Rights`'
      tags:
      - Sessions
      parameters:
      - name: sessionId
        in: path
        description: The ID of the session to retrieve start-up parameters for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Start-up parameters of the requested session were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStartUpParameters'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update start-up parameters for a specified session
      operationId: updateSessionStartupParameters
      description: '> ### Permissions required

        At least one of: `Create Process` | `Edit Process` | `Execute Process`


        and `Control Resource`'
      tags:
      - Sessions
      parameters:
      - name: sessionId
        in: path
        description: The ID of the session to update start-up parameters for.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: A start-up parameters for session.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionStartUpParameters'
      responses:
        '204':
          description: Associated parameters for a specific session were successfully updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v7/sessions/{sessionId}/logs:
