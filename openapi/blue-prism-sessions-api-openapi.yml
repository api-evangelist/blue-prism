          less:
            $ref: '#/components/examples/IntegerLessThanExample'
      - name: targetAppId
        in: query
        description: A filter to search for the target app id.
        required: false
        style: deepObject
        schema:
          $ref: '#/components/schemas/FullStringFilter'
        examples:
