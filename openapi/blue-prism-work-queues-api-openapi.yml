      - name: totalItemCount
        description: A filter to search for the total item count of the work queue.
        in: query
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/IntegerEqualsExample'
          range:
