components:
  schemas:
    ContainsStringFilter:
      description: Used to filter strings. Check for strings that contain the given value.
      type: object
      properties:
        ctn:
          type:
          - string
          - 'null'
          description: The value that the field should contain.
      example:
        ctn: null
    ActiveWorkQueueStatistics:
      description: Contains statistics for an active work queue.
      type:
      - object
      - 'null'
      properties:
        activeSessions:
          type: integer
          description: the current number of active sessions for this queue.
        availableResources:
          type: integer
          description: the current number of available resources assigned to this queue.
        timeRemaining:
          type: string
          description: the amount of time remaining for this queue based on the number of pending cases and the average work time for a case.
          format: time-span
        elapsedRemaining:
          type: string
          description: the amount of time remaining for all currently assigned sessions to work the remaining pending cases.
          format: time-span
        ETA:
          type: string
          description: the projected end time for this queue in local time.
          format: date-time
      example:
        activeSessions: '10'
        availableResources: '5'
        timeRemaining: 01:25:10
        elapsedRemaining: 00:05:10
        ETA: '2020-10-03T13:36:21+02:00'
    WorkQueueItemEventSubscriptionResponse:
      type: object
      description: The subscription created for an event type.
      properties:
        subscriptionId:
          type: string
          description: The ID of the subscription.
          format: uuid
        eventType:
          type: string
          description: The event type subscribed to.
          example: exception
    CreateWorkQueue:
      description: Contains details for creating a new work queue.
      type: object
      properties:
        name:
          type: string
          description: The name of the queue to create.
          minLength: 1
          maxLength: 255
        keyField:
          type: string
          description: The name of the column to be used as the queue's key.
          minLength: 0
          maxLength: 255
        maxAttempts:
          type: integer
          description: The maximum number of retry attempts for items in the queue.
          minimum: 1
          maximum: 999999
        status:
          $ref: '#/components/schemas/QueueStatus'
        encryptionKeyId:
          type: integer
          description: The ID of the encryption key to use for the queue. If no encryption is required,  this field should be 0.
        sessionExceptionRetry:
          type: boolean
          description: Retry items in this queue in the event of an unexpected session termination.
        activeQueueAssignedProcessId:
          type: string
          format: uuid
          description: The ID of the process to use for an active queue.
        activeQueueAssignedResourceGroupId:
          type: string
          format: uuid
          description: The ID of the resource group to use for an active queue.
        groupid:
          type: object
          description: The ID of the group to use for the queue. If no group id is required, this field should be empty string like "" or empty Guid - "00000000-0000-0000-0000-000000000000".
      example:
        name: Example queue
        keyField: Example field
        maxAttempts: 3
        status: Running
        encryptionKeyId: 0
        sessionExceptionRetry: false
        activeQueueAssignedProcessId: 658de89c-a43d-4b18-a38c-d26d5eb26659
        activeQueueAssignedResourceGroupId: 5180390c-b21a-4d69-9753-b876e34f100d
        groupid: a4e0b0ba-3b8f-443d-bdb0-ee519299bd01
    DataValue:
      description: Represents a single item of data in a Blue Prism format.
      type: object
      properties:
        valueType:
          description: The type of object contained in the value field.
          type: string
          enum:
          - Binary
          - Collection
          - Date
          - DateTime
          - Flag
          - Image
          - Number
          - Password
          - RadioButtons
          - Text
          - Time
          - TimeSpan
        value:
          description: The value of the object.
          oneOf:
          - type: string
            format: base64
            description: Used for Binary and Image data types. The image format must only be one of these BPM, JPG, JPEG, GIF, PNG, ICO or TIFF.
          - $ref: '#/components/schemas/DataCollection'
            description: Used for the Collection data type.
          - type: string
            format: date
            description: Used for Date and Time data types.
          - type: boolean
            description: Used for the Flag data type.
          - type: number
            description: Used for the Number data type.
          - type: string
            description: Used for Password and Text data types.
          - type: string
            format: time
            description: Used for the TimeSpan data type.
          - $ref: '#/components/schemas/RadioButtonsArray'
        additionalParameters:
          description: Custom extra parameters i.e. Binary's file path.
          type: array
          items:
            type: string
    EqualsFilter:
      description: Used to filter values. Check for values that are equal to the given value.
      type: object
      properties:
        eq:
          type:
          - object
          - 'null'
          description: The value that the field should be equal to.
      example:
        eq: null
    Identifier:
      description: A GUID resource ID.
      type: object
      properties:
        id:
          type: string
          description: The ID of the newly created resource.
          format: uuid
    Error:
      description: A general error occurred. See errorMessage for details.
      type: object
      properties:
        errorMessage:
          description: A message describing the problem encountered.
          type: string
    GreaterThanOrEqualToFilter:
      description: Used to filter values. Check for values that are greater than or equal to the given value.
      type: object
      properties:
        gte:
          type:
          - object
          - 'null'
          description: The value that the field should be greater than or equal to.
      example:
        gte: null
    WorkQueueConfigurationSummary:
      description: Contains details of a work queue configuration.
      type: object
      properties:
        id:
          type: string
          description: The ID of the queue.
          format: uuid
        name:
          type: string
          description: The name of the queue.
          minLength: 1
        activeWorkQueueConfiguration:
          $ref: '#/components/schemas/ActiveWorkQueueConfiguration'
        activeQueueStats:
          $ref: '#/components/schemas/ActiveWorkQueueStatistics'
      example:
        id: f83a55c4-1151-41b1-89b0-6ad81ad50d7e
        name: Example work queue
        activeWorkQueueConfiguration:
          assignedProcessId: 5ebaf769-6325-4f8a-b175-aefb150ea64f
          assignedResourceGroupId: 49df134f-974b-4f81-b4a7-8518c04fa970
        activeQueueStats:
          activeSessions: '10'
          availableResources: '5'
          timeRemaining: 01:25:10
          elapsedRemaining: 00:05:10
          ETA: '2020-10-03T13:36:21+02:00'
    BasicStringFilter:
      description: Used to filter strings. Check for strings that start with, equal, are greater than, are less than, or are between the given value(s).
      type: object
      anyOf:
      - $ref: '#/components/schemas/RangeOrEqualFilter'
      - $ref: '#/components/schemas/StartsWithStringFilter'
      example:
        strtw: null
        gte: null
        lte: null
        eq: null
    StartsWithStringFilter:
      description: Used to filter strings. Check for strings that start with the given value.
      type: object
      properties:
        strtw:
          type:
          - string
          - 'null'
          description: The value that the field should start with.
      example:
        strtw: null
    WorkQueueItem:
      description: Contains details of a work queue item including the data.
      type: object
      properties:
        id:
          type: string
          description: The ID of the item.
          format: uuid
        priority:
          type: integer
          description: The priority value assigned to the item.
        ident:
          type: integer
          description: The database-specific identity of the item.
        state:
          type: string
          enum:
          - None
          - Pending
          - Locked
          - Deferred
          - Completed
          - Exceptioned
          description: The current state of the item.
        keyValue:
          type: string
          description: The value of the key field.
        status:
          type: string
          description: The user-supplied status value.
        tags:
          type: array
          description: A collection of tags assigned to the item.
          items:
            type: string
        attemptNumber:
          type: integer
          description: The number of the attempt next time this item is worked.
          format: integer
          minimum: 1
        loadedDate:
          type: string
          description: The time and date that the item was loaded into the system.
          format: date-time
        deferredDate:
          type: string
          description: The earliest time and date that this item is deferred until.
          format: date-time
        lockedDate:
          type: string
          description: The time and date that this item was locked; or the minimum date-time value if not locked.
          format: date-time
        completedDate:
          type: string
          description: The time and date that this item was completed; or the minimum date-time value if not completed.
          format: date-time
        exceptionedDate:
          type: string
          description: The time and date that this item was marked as exceptioned; or the minimum date-time value if not exceptioned.
          format: date-time
        exceptionReason:
          type: string
          description: The error message which caused the exception, if any.
        lastUpdated:
          type: string
          description: The time and date that this item was last updated.
          format: date-time
        workTimeInSeconds:
          type: integer
