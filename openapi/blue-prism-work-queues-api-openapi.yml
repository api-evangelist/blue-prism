  /api/v7/workqueues/configurations:
    get:
      summary: Return configuration(id, name, assignedProcessId, assignedResourceGroupId and…
      operationId: getWorkQueueConfiguration
      description: '> ### Permissions required

        At least one of: `Read Access to Queue Management` | `Full Access to Queue Management`'
      tags:
      - Work Queues
      parameters:
      - name: sortBy
        description: The field that results should be sorted by and the direction they should be sorted in.
        in: query
        required: false
        schema:
          type: string
          enum:
          - NameAsc
          - NameDesc
      - name: name
        description: A filter to search for the name of the work queue configuration.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/FullStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          contains:
            $ref: '#/components/examples/StringContainsExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: itemsPerPage
        description: The maximum number of items to retrieve per page.
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pagingToken
        description: The token to point to the last item previously returned.
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A list of work queue configurations was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkQueueConfigurationsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v7/workqueues/{workQueueId}:
    get:
      summary: Return details of a work queue
      operationId: getWorkQueue
      description: '> ### Permissions required

        At least one of: `Read Access to Queue Management` | `Full Access to Queue Management`'
      tags:
      - Work Queues
      parameters:
      - name: workQueueId
        in: path
        description: The ID of the queue to retrieve details for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The work queue details were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkQueueSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Modify the work queue as described in the patch document
      operationId: updateWorkQueue
      description: '> ### Permissions required

        At least one of: `Read Access to Queue Management` | `Full Access to Queue Management`


        and `Workflow - Work Queue Configuration`

        > This endpoint does not support application server-based encryption keys. Only database-based encryption keys can be used.'
      tags:
      - Work Queues
      parameters:
      - name: workQueueId
        in: path
        description: The ID of the queue to modify.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRequest'
            examples:
              add (to array):
                $ref: '#/components/examples/PatchAddToArrayExample'
              add (to object):
                $ref: '#/components/examples/PatchAddToObjectExample'
              copy:
                $ref: '#/components/examples/PatchCopyExample'
              move:
                $ref: '#/components/examples/PatchMoveExample'
              remove:
                $ref: '#/components/examples/PatchRemoveExample'
              replace:
                $ref: '#/components/examples/PatchReplaceExample'
      responses:
        '204':
          description: The work queue was successfully updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a specified work queue
      operationId: deleteWorkQueue
      description: '> ### Permissions required: `Workflow - Work Queue Configuration`'
      tags:
      - Work Queues
      parameters:
      - name: workQueueId
        in: path
        description: The ID of the queue to delete.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The queue was successfully deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Either the queue is not empty or still has running sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v7/workqueues/{workQueueId}/references:
    get:
      summary: Return references to a specified work queue
      operationId: getWorkQueueReferences
      description: '> ### Permissions required: `Workflow - Work Queue Configuration`'
      tags:
      - Work Queues
      parameters:
      - name: workQueueId
        description: The ID of the queue to get references of.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sortBy
        description: The field that results should be sorted by and the direction they should be sorted in.
        in: query
        schema:
          type: string
          enum:
          - NameAsc
          - NameDesc
          - DescriptionAsc
          - DescriptionDesc
          - ProcessTypeAsc
          - ProcessTypeDesc
      - name: itemsPerPage
        description: The maximum number of items to retrieve.
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pagingToken
        description: The token to point to the last item previously returned.
        in: query
        schema:
          type: string
      - name: name
        description: A filter to search for the name of the reference.
        in: query
        style: deepObject
        schema:
          $ref: '#/components/schemas/BasicStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: description
        in: query
        style: deepObject
        description: A filter to search for the description of the reference.
        schema:
          $ref: '#/components/schemas/BasicStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: processType
        in: query
        style: form
        explode: false
        description: The type of the process to search for.
        schema:
          type: array
          items:
            type: string
            enum:
            - Process
            - Object
      responses:
        '200':
          description: An list of queue references was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencesItemsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v7/workqueues/{workQueueId}/items:
    get:
      summary: Return items in a specified work queue
      operationId: getWorkQueueItems
      description: '> ### Permissions required

        At least one of: `Read Access to Queue Management` | `Full Access to Queue Management`

        > ### Additional permissions for accessing Active Queue items

        At least one of: `Create Process` | `Edit Process` | `Execute Process`

        And `Control Resource`'
      tags:
      - Work Queues
      parameters:
      - name: workQueueId
        description: The ID of the queue to get an item from.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sortBy
        description: The field that results should be sorted by and the direction they should be sorted in.
        in: query
        required: false
        schema:
          type: string
          enum:
          - AttemptAsc
          - AttemptDesc
          - AttemptWorkTimeAsc
          - AttemptWorkTimeDesc
          - CompletedAsc
          - CompletedDesc
          - DeferredAsc
          - DeferredDesc
          - ExceptionAsc
          - ExceptionDesc
          - ExceptionReasonAsc
          - ExceptionReasonDesc
          - KeyValueAsc
          - KeyValueDesc
          - LastUpdatedAsc
          - LastUpdatedDesc
          - LoadedAsc
          - LoadedDesc
          - LockedAsc
          - LockedDesc
          - PriorityAsc
          - PriorityDesc
          - StatusAsc
          - StatusDesc
          - WorkTimeAsc
          - WorkTimeDesc
          - SlaAsc
          - SlaDesc
          - SlaDateTimeAsc
          - SlaDateTimeDesc
          - ProcessNameAsc
          - ProcessNameDesc
          - IsSuggestedAsc
          - IsSuggestedDesc
      - name: keyValue
        description: A filter to search for the value of the key field of the work queue item.
        in: query
        schema:
          $ref: '#/components/schemas/FullStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          contains:
            $ref: '#/components/examples/StringContainsExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: status
        description: A filter to search for the status of the work queue item.
        in: query
        schema:
          $ref: '#/components/schemas/FullStringFilter'
        examples:
          equals:
            $ref: '#/components/examples/StringEqualsExample'
          startsWith:
            $ref: '#/components/examples/StringStartsWithExample'
          contains:
            $ref: '#/components/examples/StringContainsExample'
          range:
            $ref: '#/components/examples/StringRangeExample'
          greater:
            $ref: '#/components/examples/StringGreaterThanExample'
      - name: state
        description: A filter to search for the current state of the work queue item.
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Pending
            - Locked
            - Deferred
            - Completed
            - Exceptioned
      - name: totalWorkTime
        description: A filter to search for the total work time of the work queue item.
        in: query
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/TimeEqualsExample'
          range:
            $ref: '#/components/examples/TimeRangeExample'
          greater:
            $ref: '#/components/examples/TimeLessThanExample'
      - name: loadedDate
        description: A filter to search for the time the work queue item was loaded onto the queue.
        in: query
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
            $ref: '#/components/examples/DateTimeRangeExample'
          greater:
            $ref: '#/components/examples/DateTimeGreaterThanExample'
      - name: deferredDate
        description: A filter to search for the time the work queue item is deferred until.
        in: query
        schema:
          $ref: '#/components/schemas/RangeOrEqualFilter'
        examples:
          equals:
            $ref: '#/components/examples/DateTimeEqualsExample'
          range:
