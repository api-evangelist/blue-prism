note: >-
  SS&C Blue Prism publishes NO pricing. Probed 2026-08-29: https://www.blueprism.com/pricing/
  returns 404, and the provider's own llms.txt — an 18,661-byte index the company maintains
  specifically so machines can find its content — enumerates products, solutions, services,
  case studies, analyst reports, partners, documentation, university, community and Digital
  Exchange, and does not name a pricing page anywhere. Commercial terms sit behind
  https://www.blueprism.com/contact/ and the customer portal
  (https://portal.blueprism.com/agreements, 200 but login-gated). This is consistent with the
  delivery model: Blue Prism Enterprise is licensed installed software with licence entitlements
  (processes, sessions, resources, alerts) enforced per environment — the API even exposes them
  at GET /api/v7/dashboards/currentLimitsAndUsage — but the price of those entitlements is
  negotiated, not listed.
provenance_note: >-
  This file previously carried a three-tier free/professional/enterprise scaffold written by the
  2026-05-04 bulk sweep with invented quotas (1,000 and 100,000 requests/month) and TBD prices.
  Blue Prism does not sell an API by the request and publishes no such tiers. The scaffold was
  removed on 2026-08-29 and replaced with the measured zero.
