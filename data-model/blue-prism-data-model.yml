note: >-
  The graph has two spines that meet at Session: a WORK spine (WorkQueueGroup > WorkQueue >
  WorkQueueItem > attempt) and a SCHEDULING spine (Calendar > Schedule > ScheduledTask >
  ScheduledSession). Process and Resource are the shared dimensions both spines point at. Three
  entities expose a .../references endpoint (work queue, environment variable, calendar) that
  answers "what depends on this" — the safest pre-delete check available in this API.
