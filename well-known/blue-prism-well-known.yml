method: probed
source: live unauthenticated HTTPS probes of every Blue Prism host named in apis.yml, llms.txt and the API documentation
note: >-
  Only /.well-known/security.txt on www.blueprism.com returns a real document. Every other
  path on every host 404s. The Blue Prism API itself is customer-hosted (an IIS site on the
  customer's own web server), so there is no vendor-operated API host to probe for
  openid-configuration or oauth-authorization-server — those documents, if present, are served
  by each customer's own Authentication Server instance and are not publicly discoverable.
