aid: blue-prism
name: Blue Prism
description: >-
  SS&C Blue Prism is an enterprise intelligent-automation vendor whose platform combines robotic
  process automation, business process management and agentic AI. Its products — Blue Prism
  Enterprise, Blue Prism Cloud, WorkHQ, Chorus, AI Gateway, Decipher IDP and Process Intelligence
  — coordinate people, AI agents, digital workers and APIs across regulated, mission-critical
  workflows. Blue Prism Enterprise publishes a REST contract, the Blue Prism API, covering work
  queues, sessions, schedules, calendars, processes, runtime resources, licensing and webhook
  subscriptions. The company was acquired by SS&C Technologies in 2022.
type: Index
deliveryModel:
  model: installed-software
  open_source: false
  commercial: true
  callable_host: false
  label: Customer-installed software with a customer-hosted API
  confidence: high
  source:
    - https://documentation.blueprism.com/bp-7-5/en-us/Guides/bp-api/api-introduction.htm
    - https://documentation.blueprism.com/bp-7-5/en-us/bp-api/api-example-usage.htm
  generated: '2026-08-29'
  method: searched
  note: >-
    The Blue Prism API is an MSI-installed IIS site on the customer's own web server, documented
    base URL form http(s)://<address>/api/v7. There is no vendor-operated multi-tenant API host,
    which is why the published OpenAPI carries no servers[] block.
accessModel:
  pricing: enterprise
  onboarding: sales
  trial: false
  try_now: false
  public: false
  label: Contact sales
  confidence: high
  source:
    - plans/blue-prism-plans-pricing.yml
  generated: '2026-08-29'
  method: searched
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/blue-prism.png
tags:
  - AI Automation
  - RPA
  - Intelligent Automation
  - Business Process Management
  - Process Orchestration
  - Agentic AI
  - Workflow-Automation
  - Enterprise Software
