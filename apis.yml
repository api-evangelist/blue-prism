apis:
  - aid: blue-prism:blue-prism
    name: Blue Prism API
    description: >-
      The Blue Prism API is the REST contract for Blue Prism Enterprise. It exposes work queues
      and work queue items, sessions and session logs, schedules, scheduled tasks and schedule
      logs, calendars and holiday regions, processes, runtime resources and pools, environment
      variables, encryption schemes, licences, Control Room dashboards and webhook subscriptions.
      94 operations across 67 paths, OpenAPI 3.0.3, version 7.5.1. Authentication is a JWT bearer
      token issued by Blue Prism Authentication Server via the OAuth 2.0 client-credentials grant.
    humanURL: https://documentation.blueprism.com/bp-7-5/en-us/bp-api/api-spec-home.htm
    baseURL: https://{address}/api/v7
    tags:
      - AI Automation
      - RPA
      - Intelligent Automation
      - Workflow-Automation
    tags_raw:
      - AI Automation
      - RPA
      - Intelligent Automation
      - Workflow Automation
