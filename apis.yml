  - aid: blue-prism:process-intelligence
    name: Process Intelligence API
    description: >-
      Also called the Timeline API. Lets third-party clients upload data to Process Intelligence
      projects, drive program modules without the UI, and retrieve processed results such as
      timeline statistics and calculated metrics. Blue Prism documents it in prose and ships a
      Swagger UI reference per installation rather than publishing a downloadable spec — the
      reference lives at <instance>/open-api/1.0/apidoc.html, so no machine-readable contract is
      retrievable without an instance.
    humanURL: https://documentation.blueprism.com/process-intelligence/2-1/en-us/api/api-intro.htm
    baseURL: https://{your.instance}/open-api/1.0
    tags:
      - Process Mining
      - Intelligent Automation
