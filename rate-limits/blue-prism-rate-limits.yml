note: >-
  The Blue Prism API publishes NO rate limits and NO throttling signal. Measured against the
  contract on 2026-08-29: of 94 operations, zero declare a 429 response — the declared error
  statuses are 400, 401, 403, 404, 409 and a single 503 on the health surface. No RateLimit-*,
  X-RateLimit-*, or Retry-After header appears anywhere in the contract, and no rate-limit,
  throttling or quota page exists in the 3,075-URL Blue Prism Enterprise 7.5 documentation set.
  This is an honest zero rather than a gap in the search: Blue Prism Enterprise is CUSTOMER-HOSTED
  (the API is an MSI-installed IIS site on the customer's own web server), so there is no vendor
  quota to publish — throughput is bounded by the customer's own IIS/database deployment and by
  licence entitlements, not by a vendor-imposed limit.
capacity_signals_that_do_exist:
  - operation: getLicenseLimits
    path: GET /api/v7/dashboards/currentLimitsAndUsage
    description: >-
      Current licence limits and usage. The closest thing this API has to a quota signal — it
      bounds concurrent sessions, processes, resources and alerts.
  - operation: getResourceUtilization
    path: GET /api/v7/dashboards/resourceUtilization
    description: Runtime resource utilization, i.e. how loaded the digital workforce already is.
  - path: GET /api/v7/health
    description: >-
      Dependency health of the API instance; returns 503 when unavailable. Carries no operationId
      in the published contract.
agent_guidance: >-
  With no 429 and no Retry-After, a client has no backpressure signal to key on. Back off on
  latency and on 503 from the health surface, and read currentLimitsAndUsage before starting
  sessions — a licence-capacity failure surfaces as a 403, which is indistinguishable at the
  status level from a permissions failure.
provenance_note: >-
  This file previously carried scaffold limits (10/100/1000 requests per minute across invented
  free/professional/enterprise tiers) written by the 2026-05-04 bulk sweep. Blue Prism publishes
  no such tiers and no such limits. The scaffold was removed on 2026-08-29.
