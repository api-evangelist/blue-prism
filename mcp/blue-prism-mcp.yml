deployment_note: >-
  Blue Prism ships NO MCP server — not hosted, not stdio. Its 2026 marketing positions the
  company as "agentic automation" and its llms.txt describes AI agents and an AI Gateway, but
  neither the product documentation nor any registry carries an MCP endpoint or package. There is
  also a structural reason it would be hard to ship a hosted one: Blue Prism Enterprise is
  installed on customer infrastructure, so any MCP server would have to be deployed per customer
  alongside the API. No endpoint has been invented here.
